# ============================================================
# PREPROCESSING PIPELINE
# ============================================================
# Each section lists the steps that read it. Editing a section marks those
# steps -- and everything after them -- as needing a re-run.
# ============================================================
preprocessing:

  # CHANNEL MANAGEMENT
  # Read by: load_data, mark_bad_channels
  # Written by: auto_detect_bad_channels
  # drop:       channels to remove entirely, e.g. [AUX1, ECG]
  # types:      re-label non-EEG channels so EEG-only steps skip them, as
  #             {name: type}, e.g. {ACC_X: misc, TRIGGER: stim}. Types: eeg,
  #             eog, ecg, emg, misc, stim, resp, gsr, temperature, seeg, ecog,
  #             dbs, eyegaze, pupil.
  # montage:    sensor positions by name, e.g. standard_1020, standard_1005,
  #             easycap-M1, biosemi64 -- any montage MNE ships. This feeds
  #             topomaps and every position-dependent step (interpolation,
  #             pyprep RANSAC, ICLabel), so name the cap the data was actually
  #             recorded with: standard_1020 is a generic 10-20 layout, not a
  #             cap, and on a 32-channel easycap it puts sensors up to 3 cm
  #             off. `ember init` asks which cap and writes it here; a config
  #             made any other way carries the generic default until edited.
  #             null skips it, for data carrying its own digitisation.
  # bad.manual: channels you marked bad -- interpolated
  # bad.auto:   channels pyprep found -- interpolated. Rewritten only on
  #             force=True or when the cropping changes; prune freely
  # flagged:    channels to keep an eye on; no effect on processing
  # force_keep: never mark these bad, whatever lands in bad.manual/auto
  channels:
    drop: []
    types: {}
    montage: easycap-M1  # chosen when this config was created
    bad:
      manual: [T7, FT9, TP9, F8]
      auto:   # Auto-detected using pyprep NoisyChannels
      - Fp1
      - Fp2
      - T8
      - TP10
    flagged: []
    force_keep: [Fp1, Fp2]

  # LINE NOISE REMOVAL WITH ZAPLINE
  # Read by: apply_zapline
  # enabled:           false skips the step
  # line_freq:         mains frequency -- 50.0 in Europe, 60.0 in US/Japan
  # process_harmonics: also clean 2x, 3x, ... up to Nyquist
  # adaptive:          false uses dss_line, removing a fixed nremove; true uses
  #                    dss_line_iter, which picks the number and ignores nremove
  # nremove:           components to remove when adaptive is false
  # Other meegkit keys are passed through, e.g. nfft, nkeep, win_sz, n_iter_max.
  # Only data channels are cleaned. Anything typed misc, stim or eog above is
  # left untouched -- its units are not the recording's, and mixing it in would
  # distort the cleaning of every channel that is brain data.
  zapline:
    enabled: true
    line_freq: 50.0
    process_harmonics: true
    adaptive: false
    nremove: 3

  # TIME CROPPING
  # Read by: auto_detect_bad_channels, prepare_for_ica, apply_final_preprocessing
  # Plots always show the whole recording; what the crop discards is shaded
  # "BAD_cropped" at the head and tail rather than cut away, so you can see it
  # before it goes.
  # tmin:              start time in seconds
  # tmax:              end time in seconds. null = run to the end; a negative
  #                    value trims that many seconds off the end (-5 = last 5 s)
  # drop_filter_edges: also crop the filter transient, which rings for roughly
  #                    1.65/highpass seconds at each end -- 1.65 s at 1 Hz,
  #                    16.5 s at 0.1 Hz, and a 50 Hz notch adds 3.3 s. Treated
  #                    as a minimum: a wider tmin/tmax is used as written, a
  #                    narrower one is widened and the log says which filter
  #                    demanded it. false crops by tmin/tmax verbatim.
  cropping:
    tmin: 0
    tmax:
    drop_filter_edges: true

  # AUTOMATIC BAD-SPAN DETECTION
  # Read by: auto_detect_bad_spans
  # One detector per kind of artifact a bad span is for: the ones ICA cannot
  # model, plus anything that would corrupt the decomposition by sitting in the
  # fit. Proposals land in bad_spans.auto for you to adjudicate -- a starting
  # point, not a verdict. Expect roughly one flagged second in four to be time
  # you would not have marked yourself.
  # Thresholds are in microvolts, not volts: YAML reads `50e-6` as a *string*,
  # so a volt-scale number here is a live footgun.
  # enabled:       false skips detection; the lists below still apply
  # classes:       drop one to switch that detector off
  # emg_zscore:    muscle z-score in 110-140 Hz. Lowering it to 2 touches nearly
  #                every hand-marked span but flags 14-20% of the recording
  # step_uv:       electrode pop -- uV between consecutive samples. MNE's 150
  #                default finds nothing on EEG, ever: the longest run above it
  #                is ~9 ms, against a 50 ms default min_duration
  # motion_factor: x the recording's own median 1 s peak-to-peak in 0.5-8 Hz.
  #                An absolute uV threshold does not transfer between caps, and
  #                the multiple has to be high -- at x5 it flags half a
  #                recording, at x12 about 6% of it
  # flat_uv:       dead channel -- uV per sample, held for 2 s. Insurance
  # merge_gap:     bridge proposals closer together than this. A detector fires
  #                in a stutter where a person marks one block; without
  #                bridging you get 135 spans to review instead of 41
  # min_length:    drop proposals shorter than this, after bridging. Note what
  #                this costs: a single electrode pop with nothing near it is
  #                milliseconds long and does not survive. A flaky electrode
  #                pops repeatedly and gets bridged into one block, which is
  #                the case worth reviewing; lower this to catch the other
  bad_span_detection:
    enabled: true
    classes: [emg, step, motion, flat]
    emg_zscore: 8.0
    step_uv: 50.0
    motion_factor: 12.0
    flat_uv: 0.05
    merge_gap: 2.0
    min_length: 0.5

  # BAD TIME SPANS
  # Read by: add_bad_spans
  # Written by: auto_detect_bad_spans
  # Stretches to exclude, in seconds. The description is free text, but MNE only
  # excludes a span from epochs and averages if it starts with "bad".
  # Excluded = (manual + auto) - force_keep, so accepting the automatic verdict
  # means doing nothing.
  # manual:     spans you marked -- yours, never rewritten
  # auto:       proposals, rewritten whenever detection re-runs. Deleting one
  #             sticks until a detection setting changes; use force_keep to
  #             veto it for good
  # force_keep: stretches you have looked at and cleared. Subtracted from both
  #             lists, and coarse is fine -- one entry can cover a whole lead-in
  # manual:
  # - onset: 10.5
  #   offset: 12.3
  #   description: bad_movement
  # force_keep:
  # - onset: 0.0
  #   offset: 95.0
  bad_spans:
    manual: []
    auto:   # auto-detected; prune what you disagree with
    - {onset: 0.0, offset: 1.8, description: bad_auto_emg+motion}
    - {onset: 110.9, offset: 111.7, description: bad_auto_emg}
    - {onset: 165.2, offset: 165.8, description: bad_auto_emg}
    - {onset: 170.2, offset: 171.1, description: bad_auto_emg}
